name: Check pinned game integration copies

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: node scripts/check-game-repositories.mjs --remote
        env:
          GH_TOKEN: ${{ github.token }}
