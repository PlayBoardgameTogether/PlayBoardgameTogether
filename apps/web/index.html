<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#faf7f2" />
    <meta name="description" content="和朋友共享一张游戏桌：创建房间、邀请入座，在线完成桌游对局。" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>桌游平台</title>
    <script>
      // Resolve the first paint before downloading the application bundle.
      (() => {
        let preference = 'light';
        try { preference = localStorage.getItem('boardgame.theme') || 'light'; } catch {}
        const theme = preference === 'light' || preference === 'dark'
          ? preference
          : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').content = theme === 'light' ? '#faf7f2' : '#141210';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
